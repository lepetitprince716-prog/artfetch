[package]
name = "artfetch"
version = "0.1.0"
edition = "2024"
description = "Fast multi-source illustration discovery, completion-gated fetcher, and perceptual dataset stager"
license = "Apache-2.0"
repository = "https://github.com/lepetitprince716-prog/artfetch"
keywords = ["dataset", "illustration", "deduplication", "booru", "lora"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
jpeg-encoder = "0.6"
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
